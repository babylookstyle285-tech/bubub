<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#ff758c,#ff7eb3);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
}

.card{
    background:white;
    max-width:450px;
    width:100%;
    padding:30px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1,h2{
    color:#ff4f81;
    margin-bottom:15px;
}

p{
    margin:10px 0;
    line-height:1.6;
}

button{
    padding:12px 25px;
    border:none;
    border-radius:30px;
    background:#ff4f81;
    color:white;
    cursor:pointer;
    font-size:16px;
    margin:5px;
}

button:hover{
    opacity:.9;
}

.foto{
    width:180px;
    height:180px;
    object-fit:cover;
    border-radius:50%;
    border:5px solid pink;
    margin-bottom:15px;
}

.love{
    position:absolute;
    pointer-events:none;
    animation:jatuh 5s linear forwards;
}

@keyframes jatuh{
    from{
        transform:translateY(-100px);
        opacity:1;
    }
    to{
        transform:translateY(110vh);
        opacity:0;
    }
}

#typing{
    min-height:120px;
}
</style>
</head>
<body>

<div class="card" id="box">

<h1>💌 Sayangkuuuuu</h1>
<p>Aku punya sesuatu buat pyn...</p>

<button onclick="halaman1()">Buka</button>

</div>

<script>

const box = document.getElementById("box");

function halaman1(){

box.innerHTML=`
<h2>dkit alay gpp ya hehe</h2>
<p>janji jgn ketawa hehe becanda sayangkuu</p>
<button onclick="halaman2()">klik love nya ❤️</button>
`;

}

function halaman2(){

box.innerHTML=`
<h2>Pertanyaan Penting 🤔</h2>
<p>Menurut pyn aku ganteng ndakk?</p>

<button onclick="salah()">Ganteng 😎</button>

<button onclick="halaman3()">Ganteng Banget Sayang banget 😍</button>
`;

}

function salah(){
alert("Jawabannya kurang tepat 🤨");
}

function halaman3(){

box.innerHTML=`
<h2>Betul sekali hahaha 😌</h2>

<p>Sekarang coba klik tombol ini ya</p>

<button id="prankBtn">Klik Aku ❤️</button>
`;

let btn=document.getElementById("prankBtn");

let klik=0;

btn.addEventListener("click",()=>{

klik++;

if(klik==1){
btn.innerHTML="Yakin?";
}
else if(klik==2){
btn.innerHTML="Serius Nih?";
}
else if(klik==3){

btn.style.position="relative";
btn.style.left=(Math.random()*120-60)+"px";

btn.innerHTML="Yaudah Klik Lagi 🥺";
}
else{
halaman4();
}

});

}

function halaman4(){

box.innerHTML=`
<h2>💖 Untuk Kamu 💖</h2>

<p id="typing"></p>

<br>

<button onclick="halaman5()">
Lihat Kejutanku 🎁
</button>
`;

const text=
"Aku mungkin bukan orang yang sempurna. Kadang jg bisa bikin pyn kesal, kadang juga bikin pyn nangis. Tapi ada satu hal yang nggak pernah berubah. Aku selalu bersyukur karena smpyan telah hadir di hidupku ❤️";

let i=0;

function ketik(){

if(i<text.length){

document.getElementById("typing").innerHTML+=text.charAt(i);

i++;

setTimeout(ketik,40);

}

}

ketik();

}

function halaman5(){

box.innerHTML=`

<img src="foto-kita.jpg" class="foto">

<h2>❤️ I Love You ❤️</h2>

<p>
Terima kasih sudah bertahan sampai hari ini.
<br><br>
Terima kasih untuk semua tawa,
dukungan,
dan perhatian yang selalu smpyan kasih.
<br><br>
Aku harap kita bisa membuat lebih banyak kenangan indah bersama selalu. 💕
</p>

<h3 id="hari"></h3>

<br>

<p><b>I Love You ❤️</b></p>

`;

const jadian = new Date("2026-03-29");
const sekarang = new Date();

const hari = Math.floor(
(sekarang-jadian)/(1000*60*60*24)
);

document.getElementById("hari").innerHTML=
"Sudah bersama selama "+hari+" hari ❤️";

hujanLove();

}

function hujanLove(){

for(let i=0;i<120;i++){

let love=document.createElement("div");

love.className="love";

love.innerHTML="❤️";

love.style.left=Math.random()*100+"vw";

love.style.fontSize=(20+Math.random()*25)+"px";

love.style.animationDuration=
(3+Math.random()*3)+"s";

document.body.appendChild(love);

setTimeout(()=>{
love.remove();
},6000);

}

}

</script>

</body>
</html>
